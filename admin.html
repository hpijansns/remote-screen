<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RemoteScreen - Admin Control</title>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #090d13;
      --panel: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #1f6feb;
      --danger: #da3633;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.1rem; font-weight: 700; }
    .badge { font-size: 0.75rem; background: #21262d; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .viewer-container { width: 100%; max-width: 900px; background: #000; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; aspect-ratio: 9/16; max-height: 70vh; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .overlay-empty { position: absolute; text-align: center; color: var(--muted); padding: 16px; }
    .controls { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .input-row { display: flex; gap: 8px; width: 100%; }
    input { flex: 1; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }
    button { padding: 12px 18px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .btn-connect { background: var(--accent); color: white; }
    .btn-scan { background: #21262d; color: var(--text); border: 1px solid var(--border); }
    .btn-disconnect { background: var(--danger); color: white; display: none; }
    .meta-bar { width: 100%; max-width: 900px; margin-top: 10px; font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    #reader-container { display: none; width: 100%; max-width: 900px; margin-top: 12px; background: var(--panel); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <div class="brand">RemoteScreen <span>Console</span></div>
  <div class="badge" id="netStatus">OFFLINE</div>
</header>

<main>
  <div class="viewer-container" id="videoBox">
    <div class="overlay-empty" id="emptyNotice">Code daal kar connect karein ya QR code scan karein.</div>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div class="controls">
    <div class="input-row">
      <input type="text" id="pairInput" placeholder="6-DIGIT CODE" maxlength="6">
      <button class="btn-connect" id="connectBtn">Connect</button>
      <button class="btn-scan" id="toggleScanBtn">📷 Scan QR</button>
      <button class="btn-disconnect" id="disconnectBtn">Disconnect</button>
    </div>
  </div>

  <div id="reader-container">
    <div id="qr-reader" style="width: 100%;"></div>
    <button id="closeScannerBtn" style="width: 100%; margin-top: 8px; background: var(--danger); color: white;">Close Camera</button>
  </div>

  <div class="meta-bar">
    <div>Target: <strong id="valDevice">--</strong></div>
    <div>Clock: <strong id="valClock">00:00</strong></div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, set, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAQysDZkvCf5m7TZrqck7zxb1EiTpRhFuk",
    authDomain: "remotescreen-4dc1a.firebaseapp.com",
    projectId: "remotescreen-4dc1a",
    storageBucket: "remotescreen-4dc1a.firebasestorage.app",
    messagingSenderId: "673121898826",
    appId: "1:673121898826:web:af3f82f486638b61af71b3",
    databaseURL: "https://remotescreen-4dc1a-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let pc = null;
  let sessionId = null;
  let timerInterval = null;
  let startTime = null;
  let html5QrCode = null;

  const pairInput = document.getElementById("pairInput");
  const connectBtn = document.getElementById("connectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const toggleScanBtn = document.getElementById("toggleScanBtn");
  const closeScannerBtn = document.getElementById("closeScannerBtn");
  const readerContainer = document.getElementById("reader-container");
  const remoteVideo = document.getElementById("remoteVideo");
  const emptyNotice = document.getElementById("emptyNotice");
  const netStatus = document.getElementById("netStatus");
  const valDevice = document.getElementById("valDevice");
  const valClock = document.getElementById("valClock");

  async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // QR SCANNER LOGIC
  toggleScanBtn.addEventListener("click", () => {
    readerContainer.style.display = "block";
    html5QrCode = new Html5Qrcode("qr-reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => {
        try {
          const parsed = JSON.parse(decodedText);
          if (parsed.code) {
            pairInput.value = parsed.code;
            stopScanner();
            connectBtn.click();
          }
        } catch (e) {
          pairInput.value = decodedText.trim().substring(0, 6);
          stopScanner();
          connectBtn.click();
        }
      },
      (errorMessage) => {}
    ).catch(err => {
      alert("Camera permission error: " + err);
      readerContainer.style.display = "none";
    });
  });

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        readerContainer.style.display = "none";
      }).catch(err => console.error(err));
    }
  }

  closeScannerBtn.addEventListener("click", stopScanner);

  // CONNECT LOGIC
  connectBtn.addEventListener("click", async () => {
    const rawCode = pairInput.value.trim().toUpperCase();
    if (rawCode.length < 5) return alert("Kripya sahi 6-digit code daalein.");

    connectBtn.disabled = true;
    connectBtn.innerText = "Wait...";
    netStatus.innerText = "CHECKING...";

    const hashedInput = await sha256(rawCode);

    try {
      const snap = await get(ref(db, "sessions"));
      if (!snap.exists()) {
        alert("Koi active session nahi mila. Pehle Phone A par session generate karein.");
        resetButtons();
        return;
      }

      let targetId = null;
      let targetData = null;

      snap.forEach(child => {
        const val = child.val();
        if (val.pairingCodeHash === hashedInput) {
          targetId = child.key;
          targetData = val;
        }
      });

      if (!targetId) {
        alert("Invalid code ya session expire ho chuka hai.");
        resetButtons();
        return;
      }

      sessionId = targetId;
      valDevice.innerText = targetData.deviceName || "Phone-A";
      startPeerConnection(targetData);
    } catch (err) {
      alert("Database error: " + err.message);
      resetButtons();
    }
  });

  function resetButtons() {
    connectBtn.disabled = false;
    connectBtn.innerText = "Connect";
    netStatus.innerText = "OFFLINE";
  }

  async function startPeerConnection(targetData) {
    netStatus.innerText = "CONNECTING...";

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      emptyNotice.style.display = "none";
      netStatus.innerText = "LIVE STREAMING";
      startTimer();
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        const cRef = ref(db, `sessions/${sessionId}/viewerCandidates/${Date.now()}`);
        set(cRef, event.candidate.toJSON());
      }
    };

    if (!targetData.offer) {
      alert("Host stream ready nahi hai. Thoda wait karke dobara Connect dabayein.");
      resetButtons();
      return;
    }

    await pc.setRemoteDescription(new RTCSessionDescription(targetData.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    const currentSessionRef = ref(db, `sessions/${sessionId}`);
    await update(currentSessionRef, {
      answer: { type: answer.type, sdp: answer.sdp },
      viewerConnected: true
    });

    onDisconnect(ref(db, `sessions/${sessionId}/viewerConnected`)).set(false);

    onValue(ref(db, `sessions/${sessionId}/ownerCandidates`), (snapshot) => {
      snapshot.forEach(child => {
        const cand = new RTCIceCandidate(child.val());
        pc.addIceCandidate(cand).catch(e => console.error(e));
      });
    });

    onValue(ref(db, `sessions/${sessionId}/ownerConnected`), (snapshot) => {
      if (snapshot.val() === false) {
        alert("Host ne sharing band kar di.");
        disconnect();
      }
    });

    connectBtn.style.display = "none";
    toggleScanBtn.style.display = "none";
    disconnectBtn.style.display = "block";
  }

  function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const delta = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(delta / 60)).padStart(2, '0');
      const s = String(delta % 60).padStart(2, '0');
      valClock.innerText = `${m}:${s}`;
    }, 1000);
  }

  function disconnect() {
    if (pc) pc.close();
    pc = null;
    if (timerInterval) clearInterval(timerInterval);
    remoteVideo.srcObject = null;
    emptyNotice.style.display = "block";
    netStatus.innerText = "OFFLINE";
    connectBtn.style.display = "block";
    toggleScanBtn.style.display = "block";
    disconnectBtn.style.display = "none";
    connectBtn.disabled = false;
    connectBtn.innerText = "Connect";
    valDevice.innerText = "--";
    valClock.innerText = "00:00";
  }

  disconnectBtn.addEventListener("click", disconnect);
</script>

</body>
</html>
